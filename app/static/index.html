<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de PDF</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📄</text></svg>">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<header class="toolbar">
  <div class="toolbar__group">
    <strong class="brand">Editor de PDF</strong>
    <button id="btn-open" class="btn btn--primary">Abrir PDF</button>
    <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
    <span id="doc-name" class="doc-name"></span>
  </div>

  <div class="toolbar__group" id="tools" hidden>
    <div class="btn-group" role="group" aria-label="Herramientas">
      <button class="btn btn--tool is-active" data-tool="select" title="Seleccionar y editar texto (V)">✏️ Editar</button>
      <button class="btn btn--tool" data-tool="text" title="Añadir un cuadro de texto (T)">➕ Texto</button>
      <button class="btn btn--tool" data-tool="image" title="Insertar una imagen (I)">🖼️ Imagen</button>
      <button class="btn btn--tool" data-tool="erase" title="Borrar una zona (E)">🧽 Borrar</button>
    </div>
    <span class="sep"></span>
    <button id="btn-undo" class="btn" disabled title="Deshacer (Ctrl+Z)">↶</button>
    <button id="btn-redo" class="btn" disabled title="Rehacer (Ctrl+Mayús+Z)">↷</button>
    <span class="sep"></span>
    <label class="field">
      <span>Zoom</span>
      <select id="zoom">
        <option value="0.75">75 %</option>
        <option value="1">100 %</option>
        <option value="1.25">125 %</option>
        <option value="1.5" selected>150 %</option>
        <option value="2">200 %</option>
        <option value="3">300 %</option>
      </select>
    </label>
  </div>

  <div class="toolbar__group toolbar__group--end" id="save-group" hidden>
    <span id="status" class="status" aria-live="polite"></span>
    <button id="btn-save" class="btn btn--primary">Guardar PDF</button>
  </div>
</header>

<main class="workspace">
  <aside class="pages" id="pages-rail" hidden>
    <div class="pages__head">
      <span>Páginas</span>
      <button id="btn-add-page" class="btn btn--icon" title="Añadir página en blanco">＋</button>
    </div>
    <ol class="pages__list" id="thumbs"></ol>
  </aside>

  <section class="canvas-area" id="canvas-area">
    <div class="dropzone" id="dropzone">
      <div class="dropzone__inner">
        <div class="dropzone__icon">📄</div>
        <h1>Edita el texto de tus PDF</h1>
        <p>
          Arrastra un PDF aquí o <button class="linkbtn" id="dropzone-open">selecciona un archivo</button>.
          El texto se reescribe con la <strong>misma fuente embebida</strong> del documento original.
        </p>
        <p class="dropzone__note">Los archivos se procesan en tu propio equipo y no salen de él.</p>
      </div>
    </div>
    <div class="pages-view" id="pages-view"></div>
  </section>
</main>

<div class="formatbar" id="formatbar" hidden>
  <label class="field">
    <span>Fuente</span>
    <select id="fmt-family"></select>
  </label>
  <label class="field field--narrow">
    <span>Tamaño</span>
    <input type="number" id="fmt-size" min="1" max="400" step="0.5">
  </label>
  <label class="field field--color" title="Color del texto">
    <span>Color</span>
    <input type="color" id="fmt-color">
  </label>
  <div class="btn-group">
    <button class="btn btn--icon" id="fmt-bold" title="Negrita"><b>B</b></button>
    <button class="btn btn--icon" id="fmt-italic" title="Cursiva"><i>I</i></button>
  </div>
  <div class="btn-group" id="fmt-align">
    <button class="btn btn--icon" data-align="left" title="Alinear a la izquierda">⬅</button>
    <button class="btn btn--icon" data-align="center" title="Centrar">⬌</button>
    <button class="btn btn--icon" data-align="right" title="Alinear a la derecha">➡</button>
  </div>
  <label class="check" title="Reduce el tamaño para que el texto quepa en el ancho original">
    <input type="checkbox" id="fmt-fit"><span>Ajustar</span>
  </label>
  <span class="sep"></span>
  <button class="btn btn--danger btn--icon" id="fmt-delete" title="Borrar este texto">🗑</button>
  <button class="btn btn--primary" id="fmt-apply" title="Aplicar (Ctrl+Enter)">Aplicar</button>
</div>

<div class="toast-stack" id="toasts"></div>

<div class="overlay" id="busy" hidden><div class="spinner"></div><span id="busy-label">Procesando…</span></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
